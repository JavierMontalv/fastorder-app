AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 and CloudFront hosting for COMANDA admin and QR frontends.

Parameters:
  GitHubOwner:
    Type: String
    Default: JavierMontalv
  CustomDomainCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN in us-east-1. Leave empty until DNS validation succeeds.

Conditions:
  UseCustomDomains: !Not [!Equals [!Ref CustomDomainCertificateArn, '']]

Resources:
  AdminBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub comanda-admin-web-prod-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RetainPreviousReleases
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: COMANDA
        - Key: Environment
          Value: Production
        - Key: Application
          Value: Admin

  MenuBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub comanda-menu-web-prod-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RetainPreviousReleases
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: COMANDA
        - Key: Environment
          Value: Production
        - Key: Application
          Value: Menu

  AdminOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: comanda-admin-oac
        Description: Signed access from CloudFront to the private admin bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MenuOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: comanda-menu-oac
        Description: Signed access from CloudFront to the private menu bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: comanda-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless SPA routes to the cached index document.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri || '/';
          var isDirectory = uri.charAt(uri.length - 1) === '/';
          var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);
          var hasExtension = lastSegment.indexOf('.') !== -1;

          if (isDirectory || !hasExtension) {
            request.uri = '/index.html';
          }

          return request;
        }

  CommercialSeoFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: comanda-commercial-seo-managed
      AutoPublish: true
      FunctionConfig:
        Comment: Public SEO pages, canonical hosts and protected administration routes.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value.toLowerCase();
          var uri = request.uri || '/';
          var query = request.querystring || {};
          var queryParts = [];
          Object.keys(query).forEach(function (key) {
            var values = query[key].multiValue || [query[key]];
            values.forEach(function (item) { queryParts.push(key + '=' + item.value); });
          });
          var search = queryParts.length ? '?' + queryParts.join('&') : '';
          function redirect(url) {
            var headers = { location: { value: url }, 'cache-control': { value: 'public,max-age=300' } };
            if (host === 'admin.somoscomanda.com') headers['x-robots-tag'] = { value: 'noindex, nofollow, noarchive' };
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: headers };
          }
          if (host === 'somoscomanda.com') return redirect('https://www.somoscomanda.com' + uri + search);
          var routes = {
            '/menu-qr-restaurantes': '/seo/menu-qr-restaurantes.html',
            '/pedidos-qr-por-mesa': '/seo/pedidos-qr-por-mesa.html',
            '/planes-comanda': '/seo/planes-comanda.html',
            '/guias/menu-qr-o-pdf': '/seo/guias-menu-qr-o-pdf.html'
          };
          var trimmed = uri.length > 1 && uri.charAt(uri.length - 1) === '/' ? uri.slice(0, -1) : uri;
          if (routes[trimmed]) {
            if (host === 'admin.somoscomanda.com') return redirect('https://www.somoscomanda.com' + trimmed + search);
            if (trimmed !== uri) return redirect('https://www.somoscomanda.com' + trimmed + search);
            request.uri = routes[trimmed]; return request;
          }
          var isActivation = query.modo || query.plan;
          if (uri === '/inicio' || uri === '/inicio/') {
            if (host === 'admin.somoscomanda.com' && isActivation) { request.uri = '/activation.html'; return request; }
            return redirect('https://www.somoscomanda.com/' + search);
          }
          if (uri === '/descubre') return redirect('https://www.somoscomanda.com/' + search);
          if (uri === '/') { request.uri = host === 'admin.somoscomanda.com' ? '/index.html' : '/landing.html'; return request; }
          var privateRoute = /^\/(pagos|admin|login|cambiar-password|onboarding|pedidos|productos|reservas|promociones|categorias|configuracion|analiticas|auditoria|usuarios|soporte-ia|superadmin|display)(\/|$)/.test(uri) || uri === '/planes/gracias';
          if (privateRoute) {
            if (host !== 'admin.somoscomanda.com') return redirect('https://admin.somoscomanda.com' + uri + search);
            request.uri = '/index.html'; return request;
          }
          var segment = uri.substring(uri.lastIndexOf('/') + 1);
          if (segment.indexOf('.') !== -1) return request;
          return { statusCode: 404, statusDescription: 'Not Found', headers: { 'content-type': { value: 'text/html; charset=utf-8' }, 'x-robots-tag': { value: 'noindex,follow' }, 'cache-control': { value: 'public,max-age=60' } }, body: { encoding: 'text', data: '<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Página no encontrada | Comanda</title><body style="font-family:system-ui;background:#faf9f5;color:#182821;padding:10vh 8vw"><p>COMANDA</p><h1>Esta página no está disponible.</h1><a href="https://www.somoscomanda.com/">Volver a Comanda</a></body></html>' } };
        }

  AdminNoIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: comanda-admin-noindex-response
      AutoPublish: true
      FunctionConfig:
        Comment: Prevent indexing of every response served from the administration host.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var response = event.response;
          var host = event.request.headers.host && event.request.headers.host.value;
          if (host && host.toLowerCase() === 'admin.somoscomanda.com') {
            response.headers['x-robots-tag'] = { value: 'noindex, nofollow, noarchive' };
          }
          return response;
        }

  AdminDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: COMANDA admin production AWS origin
        Enabled: true
        Aliases: !If
          - UseCustomDomains
          - [admin.somoscomanda.com, somoscomanda.com, www.somoscomanda.com]
          - !Ref AWS::NoValue
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: admin-s3-origin
            DomainName: !GetAtt AdminBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AdminOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: admin-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CommercialSeoFunction.FunctionARN
            - EventType: viewer-response
              FunctionARN: !GetAtt AdminNoIndexFunction.FunctionARN
        ViewerCertificate: !If
          - UseCustomDomains
          - AcmCertificateArn: !Ref CustomDomainCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: COMANDA
        - Key: Environment
          Value: Production
        - Key: Application
          Value: Admin

  MenuDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: COMANDA menu production AWS origin
        Enabled: true
        Aliases: !If
          - UseCustomDomains
          - [menu.somoscomanda.com]
          - !Ref AWS::NoValue
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: menu-s3-origin
            DomainName: !GetAtt MenuBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt MenuOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: menu-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        ViewerCertificate: !If
          - UseCustomDomains
          - AcmCertificateArn: !Ref CustomDomainCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: COMANDA
        - Key: Environment
          Value: Production
        - Key: Application
          Value: Menu

  AdminBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${AdminBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminDistribution}

  MenuBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MenuBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${MenuBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${MenuDistribution}

  AdminDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ComandaAdminGitHubDeployRole
      Description: Least-privilege OIDC deployment role for the COMANDA admin frontend.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}/fastorder-app:ref:refs/heads/main
      Policies:
        - PolicyName: DeployAdminStaticAssets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListDeploymentBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt AdminBucket.Arn
              - Sid: ReplaceDeploymentObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:PutObject
                Resource: !Sub ${AdminBucket.Arn}/*
              - Sid: InvalidateAdminDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminDistribution}
      Tags:
        - Key: Project
          Value: COMANDA

  MenuDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ComandaMenuGitHubDeployRole
      Description: Least-privilege OIDC deployment role for the COMANDA QR menu frontend.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}/fastorder-client-qr:environment:production
      Policies:
        - PolicyName: DeployMenuStaticAssets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListDeploymentBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt MenuBucket.Arn
              - Sid: ReplaceDeploymentObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:PutObject
                Resource: !Sub ${MenuBucket.Arn}/*
              - Sid: InvalidateMenuDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${MenuDistribution}
      Tags:
        - Key: Project
          Value: COMANDA

Outputs:
  AdminBucketName:
    Value: !Ref AdminBucket
  AdminDistributionId:
    Value: !Ref AdminDistribution
  AdminTemporaryDomain:
    Value: !GetAtt AdminDistribution.DomainName
  AdminDeployRoleArn:
    Value: !GetAtt AdminDeployRole.Arn
  MenuBucketName:
    Value: !Ref MenuBucket
  MenuDistributionId:
    Value: !Ref MenuDistribution
  MenuTemporaryDomain:
    Value: !GetAtt MenuDistribution.DomainName
  MenuDeployRoleArn:
    Value: !GetAtt MenuDeployRole.Arn
